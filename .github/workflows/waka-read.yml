name: Waka Readme

on:
  # for manual workflow trigger
  workflow_dispatch:
  schedule:
    # 00:00 UTC = 05:00 in Tashkent
    - cron: "0 0 * * *"

permissions:
  contents: write

# Two runs writing the same README section would race each other.
concurrency:
  group: waka-readme
  cancel-in-progress: false

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      # Pinned to a master commit, not a tag. v0.3.1 (May 2024) is the latest
      # release but pads the time column to 16 chars, so "2,153 hrs 46 mins"
      # overflows and the bars stop lining up. The fix (50487a2) is only on
      # master. A SHA is also stricter than a tag: tags can be moved.
      # Do not "upgrade" this to v0.3.1 - that is a downgrade.
      - uses: athul/waka-readme@370590ad8da8f54282ed92aa42b7c25ecbd5a9a6 # master 2026-02-18
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # optional if on profile readme
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }} # required
          ### meta
          API_BASE_URL: https://wakatime.com/api # optional
          REPOSITORY: JaysonKhan/JaysonKhan # optional
          ### content
          SHOW_TITLE: true # optional
          SECTION_NAME: waka # optional
          BLOCKS: ⣀⣄⣤⣦⣶⣷⣿ # optional
          CODE_LANG: python # optional
          TIME_RANGE: all_time # optional
          # Docs and config formats, not languages anyone writes by choice.
          IGNORED_LANGUAGES: Markdown YAML JSON # optional
          # 13, not 10: ignored languages still use up a slot, because the
          # action counts rows by their index in the unfiltered list.
          # 13 minus the three above leaves 10 visible rows.
          LANG_COUNT: 13 # optional
          SHOW_TIME: true # optional
          SHOW_TOTAL: true # optional
          SHOW_MASKED_TIME: false # optional
          # false => keep listing languages after the "Other" bucket,
          # so the README shows the real stack, not just 2 rows
          STOP_AT_OTHER: false # optional

          AUTHOR_NAME: Jahongir # optional
          AUTHOR_EMAIL: bettaxacker@gmail.com # optional
          ### commit
          COMMIT_MESSAGE: Biodagi ma`lumotlar yangilani # optional
          # this repo's default branch is `main` (there is no `master`)
          TARGET_BRANCH: main # optional
          TARGET_PATH: README.md # optional
          COMMITTER_NAME: Workflow347 # optional
          COMMITTER_EMAIL: action-bot@github.com # optional
          # you can populate email-id with secretes instead
